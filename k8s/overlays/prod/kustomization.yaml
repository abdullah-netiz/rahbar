apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

images:
  - name: rahbar-api
    newName: docker.io/rahbar/api
    newTag: prod
  - name: rahbar-indexer
    newName: docker.io/rahbar/indexer
    newTag: prod
  - name: rahbar-ui
    newName: docker.io/rahbar/ui
    newTag: prod

