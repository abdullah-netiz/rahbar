<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAHBAR — Grounded University Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090c10;
    --panel: #11161d;
    --panel-hover: #161e27;
    --ink: #f0f6fc;
    --muted: #8b949e;
    --line: rgba(255, 255, 255, 0.08);
    --line-subtle: rgba(255, 255, 255, 0.04);
    
    /* Neon Green & Electric Blue / Cyan Gradient */
    --neon-gradient: linear-gradient(135deg, #00ff87 0%, #60efff 50%, #0061ff 100%);
    --neon-glow: rgba(0, 255, 135, 0.22);
    --cyan-glow: rgba(96, 239, 255, 0.25);
    
    /* User & Assistant Bubble Themes */
    --user-bubble-bg: linear-gradient(135deg, #0e1e24 0%, #112d38 100%);
    --user-bubble-border: rgba(96, 239, 255, 0.35);
    
    --assistant-bubble-bg: #11151c;
    --assistant-bubble-border: rgba(255, 255, 255, 0.07);

    --ok-bg: rgba(0, 255, 135, 0.12);
    --ok-ink: #00ff87;
    --ok-border: rgba(0, 255, 135, 0.3);

    --warn-bg: rgba(234, 179, 8, 0.12);
    --warn-ink: #facc15;
    --warn-border: rgba(250, 204, 21, 0.25);

    --err-bg: rgba(239, 68, 68, 0.12);
    --err-ink: #f87171;
    --err-border: rgba(248, 113, 113, 0.25);

    --code-bg: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Ambient glowing backdrop with neon cyan and green */
  body::before {
    content: "";
    position: fixed;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 750px;
    height: 420px;
    background: radial-gradient(ellipse at top, rgba(96, 239, 255, 0.10) 0%, rgba(0, 255, 135, 0.06) 45%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 36px 20px 170px;
    flex: 1;
    position: relative;
    z-index: 1;
  }

  header {
    margin-bottom: 34px;
    text-align: center;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(0, 255, 135, 0.05);
    border: 1px solid rgba(96, 239, 255, 0.2);
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 14px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
  }

  .triangle-badge-icon {
    width: 13px;
    height: 13px;
    fill: url(#neonGrad);
    display: inline-block;
    filter: drop-shadow(0 0 6px rgba(0, 255, 135, 0.6));
  }

  header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 10%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p {
    margin: 8px auto 0;
    max-width: 500px;
    color: var(--muted);
    font-size: 14.5px;
  }

  /* Quick Suggestion Chips */
  .quick-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }

  .quick-chip {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .quick-chip:hover {
    background: var(--panel-hover);
    color: var(--ink);
    border-color: rgba(96, 239, 255, 0.4);
    box-shadow: 0 0 12px rgba(96, 239, 255, 0.15);
    transform: translateY(-1px);
  }

  #thread {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* User Message Bubble with Neon Accent */
  .q {
    align-self: flex-end;
    max-width: 82%;
    background: var(--user-bubble-bg);
    border: 1px solid var(--user-bubble-border);
    color: #ffffff;
    padding: 13px 19px;
    border-radius: 20px 20px 4px 20px;
    font-size: 15px;
    white-space: pre-wrap;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: fadeIn 0.25s ease-out;
  }

  /* Assistant Message Container */
  .a-wrapper {
    display: flex;
    gap: 14px;
    align-self: flex-start;
    max-width: 100%;
    animation: fadeIn 0.3s ease-out;
  }

  /* Triangle Avatar */
  .avatar-triangle {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(0, 255, 135, 0.1) 0%, rgba(96, 239, 255, 0.12) 100%);
    border: 1px solid rgba(96, 239, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 14px var(--neon-glow);
    margin-top: 2px;
  }

  .avatar-triangle svg {
    width: 18px;
    height: 18px;
  }

  .a {
    flex: 1;
    background: var(--assistant-bubble-bg);
    border: 1px solid var(--assistant-bubble-border);
    border-radius: 4px 20px 20px 20px;
    padding: 18px 22px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
  }

  .a .text {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.65;
    color: #e2e8f0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Toggle Grounding Button */
  .grounding-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
  }

  .grounding-toggle:hover {
    background: rgba(0, 255, 135, 0.06);
    color: var(--ink);
    border-color: rgba(0, 255, 135, 0.35);
  }

  .grounding-toggle .icon {
    font-size: 11px;
    transition: transform 0.2s ease;
  }

  .grounding-toggle.open .icon {
    transform: rotate(90deg);
  }

  /* Grounding Details Drawer */
  .grounding-drawer {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--line);
    border-radius: 12px;
    animation: fadeIn 0.2s ease-out;
  }

  .grounding-drawer.show {
    display: block;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .chip {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .chip.ok {
    background: var(--ok-bg);
    color: var(--ok-ink);
    border-color: var(--ok-border);
  }

  .chip.warn {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-color: var(--warn-border);
  }

  .sources-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 10px 0 6px;
  }

  ol.cites {
    margin: 0;
    padding-left: 20px;
    font-size: 13.5px;
    color: #cbd5e1;
  }

  ol.cites li {
    margin-bottom: 4px;
  }

  details {
    margin-top: 12px;
  }

  summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  summary:hover {
    color: var(--ink);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-top: 8px;
  }

  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  th {
    color: var(--muted);
    font-weight: 600;
  }

  td.num {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .meta {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--muted);
  }

  code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: #cbd5e1;
  }

  .err {
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    color: var(--err-ink);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14.5px;
  }

  /* Immersive Thinking & Spinning Triangle Indicator */
  .thinking-wrapper {
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--assistant-bubble-bg);
    border: 1px solid var(--assistant-bubble-border);
    border-radius: 20px;
    padding: 14px 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    max-width: 460px;
    animation: fadeIn 0.25s ease-out;
  }

  .spinning-triangle-box {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .spinning-triangle {
    width: 24px;
    height: 24px;
    transform-origin: 50% 50%;
    will-change: transform;
    animation: butterSmoothSpin 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }

  .thinking-label-container {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .thinking-phase {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: var(--neon-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .thinking-status-text {
    font-size: 14px;
    color: #cbd5e1;
    transition: opacity 0.25s ease;
  }

  /* Floating Bottom Input Bar */
  form {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(9, 12, 16, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    padding: 16px 20px 20px;
    z-index: 100;
  }

  .bar-container {
    max-width: 820px;
    margin: 0 auto;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 6px 8px 6px 18px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .bar:focus-within {
    border-color: rgba(96, 239, 255, 0.6);
    box-shadow: 0 4px 24px rgba(96, 239, 255, 0.2);
  }

  textarea {
    flex: 1;
    resize: none;
    height: 28px;
    max-height: 120px;
    padding: 4px 0;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 0;
    outline: none;
  }

  textarea::placeholder {
    color: #4b5563;
  }

  button#send {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--neon-gradient);
    border: 0;
    border-radius: 50%;
    color: #090c10;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(0, 255, 135, 0.35);
  }

  button#send:hover:not(:disabled) {
    transform: scale(1.08);
  }

  button#send:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  button#send svg {
    width: 18px;
    height: 18px;
    fill: #090c10;
  }

  .hint {
    text-align: center;
    margin-top: 8px;
    font-size: 11.5px;
    color: #64748b;
  }

  /* Smooth like butter stylish rotation: 0° (Start) -> 90° (Clockwise) -> 180° (Inverted) -> 270° (Left) -> 360° (Back to Start) */
  @keyframes butterSmoothSpin {
    0% {
      transform: rotate(0deg);
      filter: drop-shadow(0 0 8px rgba(0, 255, 135, 0.5));
    }
    25% {
      transform: rotate(90deg);
      filter: drop-shadow(0 0 14px rgba(96, 239, 255, 0.75));
    }
    50% {
      transform: rotate(180deg);
      filter: drop-shadow(0 0 18px rgba(0, 255, 135, 0.85)) drop-shadow(0 0 8px rgba(96, 239, 255, 0.65));
    }
    75% {
      transform: rotate(270deg);
      filter: drop-shadow(0 0 14px rgba(96, 239, 255, 0.75));
    }
    100% {
      transform: rotate(360deg);
      filter: drop-shadow(0 0 8px rgba(0, 255, 135, 0.5));
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Hidden SVG Gradients Definition -->
<svg width="0" height="0" style="position: absolute;">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#60efff" />
      <stop offset="100%" stop-color="#0061ff" />
    </linearGradient>
  </defs>
</svg>

<main>
  <header>
    <div class="brand-badge">
      <svg class="triangle-badge-icon" viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21" fill="url(#neonGrad)"/></svg>
      FAST-NUCES Official Grounded Assistant
    </div>
    <h1>RAHBAR</h1>
    <p>Grounded university question-answering with verifiable citations and zero hallucinations.</p>
    
    <div class="quick-prompts">
      <button class="quick-chip" type="button">What CGPA puts a student on academic warning?</button>
      <button class="quick-chip" type="button">What is the minimum attendance for final exams?</button>
      <button class="quick-chip" type="button">How much is the BS tuition fee per credit hour?</button>
      <button class="quick-chip" type="button">How do I apply for a hostel room?</button>
    </div>
  </header>
  
  <section id="thread" aria-live="polite"></section>
</main>

<form id="ask">
  <div class="bar-container">
    <div class="bar">
      <textarea id="question" aria-label="Your question" placeholder="Ask about academic rules, fees, grading, attendance..." maxlength="500" required rows="1"></textarea>
      <button id="send" type="submit" aria-label="Send question">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for new line · Strict document grounding</div>
  </div>
</form>

<script>
const API_BASE = new URLSearchParams(location.search).get("api") || window.RAHBAR_API || "";

const thread = document.getElementById("thread");
const form = document.getElementById("ask");
const input = document.getElementById("question");
const send = document.getElementById("send");

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function chip(text, kind) {
  return el("span", { class: kind ? `chip ${kind}` : "chip" }, text);
}

function cite(c) {
  return c.page != null ? `${c.source} / ${c.section}, p. ${c.page}` : `${c.source} / ${c.section}`;
}

function createTriangleSVG() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  // Mathematically centered equilateral triangle (centroid at exactly 12, 12) for zero-wobble butter spin
  poly.setAttribute("points", "12,3.33 19.5,16.33 4.5,16.33");
  poly.setAttribute("fill", "url(#neonGrad)");
  poly.setAttribute("stroke", "url(#neonGrad)");
  poly.setAttribute("stroke-width", "2");
  poly.setAttribute("stroke-linejoin", "round");
  svg.appendChild(poly);
  return svg;
}

function renderAnswer(data, cacheHeader) {
  const wrapper = el("div", { class: "a-wrapper" });
  
  // Triangle Avatar Icon
  const avatar = el("div", { class: "avatar-triangle" });
  avatar.appendChild(createTriangleSVG());
  wrapper.append(avatar);

  const card = el("article", { class: "a" });
  card.append(el("p", { class: "text" }, data.answer ?? ""));

  // Collapsible Grounding & Sources Drawer
  const hasCitations = Array.isArray(data.citations) && data.citations.length > 0;
  const hasPassages = Array.isArray(data.retrieved) && data.retrieved.length > 0;
  const citationCount = hasCitations ? data.citations.length : 0;

  const toggleBtn = el("button", { class: "grounding-toggle", type: "button" });
  toggleBtn.append(el("span", { class: "icon" }, "▶"));
  toggleBtn.append(document.createTextNode(hasCitations 
    ? `Verified Sources & Grounding (${citationCount})` 
    : "Grounding Details"));
  card.append(toggleBtn);

  const drawer = el("div", { class: "grounding-drawer" });

  const chips = el("div", { class: "chips" });
  chips.append(data.answered_from_context
    ? chip("From university documents", "ok")
    : chip("Not covered by documents (Abstention)", "warn"));
  if (data.confidence) chips.append(chip(`confidence: ${data.confidence}`));
  if (data.provider) chips.append(chip(`provider: ${data.provider}`));
  const cached = typeof data.cached === "boolean" ? data.cached
               : cacheHeader ? cacheHeader.toUpperCase() === "HIT" : null;
  if (cached !== null) chips.append(chip(cached ? "cache: hit" : "cache: miss"));
  drawer.append(chips);

  if (hasCitations) {
    drawer.append(el("div", { class: "sources-title" }, "Cited Provisions"));
    const list = el("ol", { class: "cites" });
    for (const c of data.citations) list.append(el("li", {}, cite(c)));
    drawer.append(list);
  }

  if (hasPassages) {
    const details = el("details");
    details.append(el("summary", {}, `Retrieved chunks (${data.retrieved.length})`));
    const table = el("table");
    const head = el("tr");
    for (const h of ["Source", "Section", "Page", "Score"]) head.append(el("th", {}, h));
    table.append(head);
    for (const r of data.retrieved) {
      const row = el("tr");
      row.append(el("td", {}, r.source), el("td", {}, r.section), el("td", { class: "num" }, r.page ?? "–"),
                 el("td", { class: "num" }, typeof r.score === "number" ? r.score.toFixed(3) : "–"));
      table.append(row);
    }
    details.append(table);
    drawer.append(details);
  }

  if (data.request_id) {
    const meta = el("div", { class: "meta" }, "request id: ");
    meta.append(el("code", {}, data.request_id));
    drawer.append(meta);
  }

  card.append(drawer);

  toggleBtn.addEventListener("click", () => {
    const isOpen = drawer.classList.toggle("show");
    toggleBtn.classList.toggle("open", isOpen);
  });

  wrapper.append(card);
  return wrapper;
}

function errorMessage(status, body) {
  const detail = body && typeof body.detail === "string" ? body.detail : "";
  if (status === 422) return "Questions must be 3 to 500 characters.";
  if (status === 429) return "Too many questions in a short time. Wait a moment and try again.";
  if (status === 503) return `The service is not ready yet${detail ? `: ${detail}` : "."}`;
  if (status >= 500) return `The service failed (HTTP ${status})${detail ? `: ${detail}` : "."}`;
  return `Request failed (HTTP ${status})${detail ? `: ${detail}` : "."}`;
}

async function ask(question) {
  thread.append(el("div", { class: "q" }, question));
  
  // Immersive Thinking Indicator with 3D Spinning Triangle and Cycling Thought States
  const thinkingWrapper = el("div", { class: "thinking-wrapper" });
  
  const spinBox = el("div", { class: "spinning-triangle-box" });
  const spinTri = createTriangleSVG();
  spinTri.classList.add("spinning-triangle");
  spinBox.appendChild(spinTri);
  thinkingWrapper.appendChild(spinBox);
  
  const labelCol = el("div", { class: "thinking-label-container" });
  const phaseLabel = el("div", { class: "thinking-phase" }, "Reasoning");
  const statusText = el("div", { class: "thinking-status-text" }, "Thinking…");
  labelCol.appendChild(phaseLabel);
  labelCol.appendChild(statusText);
  thinkingWrapper.appendChild(labelCol);
  
  thread.append(thinkingWrapper);
  thinkingWrapper.scrollIntoView({ behavior: "smooth", block: "end" });
  send.disabled = true;

  // Gemini-style dynamic thought steps
  const thoughts = [
    "Thinking…",
    "Searching university handbooks & records…",
    "Cross-referencing clause numbers & regulations…",
    "Validating strict citation grounding…",
    "Synthesizing response with zero hallucinations…"
  ];
  let thoughtIdx = 0;
  const thoughtInterval = setInterval(() => {
    thoughtIdx = (thoughtIdx + 1) % thoughts.length;
    statusText.style.opacity = "0";
    setTimeout(() => {
      statusText.textContent = thoughts[thoughtIdx];
      statusText.style.opacity = "1";
    }, 200);
  }, 2600);

  try {
    const res = await fetch(`${API_BASE}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    let body = null;
    try { body = await res.json(); } catch { /* non-JSON error page */ }
    
    clearInterval(thoughtInterval);
    thinkingWrapper.remove();
    
    if (!res.ok) {
      thread.append(el("div", { class: "err" }, errorMessage(res.status, body)));
    } else {
      thread.append(renderAnswer(body, res.headers.get("X-Cache")));
    }
  } catch (err) {
    clearInterval(thoughtInterval);
    thinkingWrapper.remove();
    thread.append(el("div", { class: "err" }, `Could not reach the API at ${API_BASE || location.origin}/api/ask.`));
  } finally {
    send.disabled = false;
    input.focus();
    thread.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "end" });
  }
}

// Quick chip clicks
document.querySelectorAll(".quick-chip").forEach((btn) => {
  btn.addEventListener("click", () => {
    input.value = btn.textContent;
    form.requestSubmit();
  });
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q.length < 3) return;
  input.value = "";
  input.style.height = "28px";
  ask(q);
});

// Auto-expand textarea
input.addEventListener("input", () => {
  input.style.height = "28px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { 
    e.preventDefault(); 
    form.requestSubmit(); 
  }
});
</script>
</body>
</html>
