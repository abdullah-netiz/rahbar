name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run test suite
        run: |
          cd api && pytest
          cd ../indexer && pytest

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest

      - name: Build and push indexer image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest

      - name: Build and push ui image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster for deployment verification
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-prod

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Deploy by commit SHA
        run: |
          kubectl set image deployment/api api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -n rahbar --dry-run=client -o yaml | kubectl apply -f - || true

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s || true
          kubectl rollout status deployment/ui -n rahbar --timeout=120s || true

      - name: Verify deployed endpoints
        run: |
          kubectl get endpoints -n rahbar

